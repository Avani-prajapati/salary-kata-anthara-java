<div class="history-list">
  @for (entry of history(); track $index) {
    <div class="history-entry">
      <div class="entry-amount">
        {{ entry.amount | currency: entry.currencyCode : 'symbol' : '1.0-2' }}
      </div>
      <div class="entry-effective-date">
        {{ entry.effectiveDate }}
      </div>
      <div class="entry-recorded-at">
        {{ entry.recordedAt | date: 'short' }}
      </div>
    </div>
  }
</div>
